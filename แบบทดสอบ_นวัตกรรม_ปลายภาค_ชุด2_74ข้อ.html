<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบ: แบบทดสอบปลายภาค ชุดที่ 2 นวัตกรรมการสอนคณิต</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700;900&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== หน้าตาถอดจาก chula/หลักสูตร/แบบทดสอบ_หลักสูตร_100ข้อ_1.html — ห้ามแก้ ให้ทุกชุดเหมือนกัน ===== */
:root{
  --paper:#EEF1F6;
  --card:#FFFFFF;
  --ink:#1B2430;
  --ink-soft:#5B6572;
  --primary:#223A6B;
  --primary-light:#3C5B99;
  --gold:#B8862E;
  --gold-bg:#F5ECD9;
  --success:#2F7D4F;
  --success-bg:#E5F3EA;
  --danger:#B23A3A;
  --danger-bg:#FBEAEA;
  --border:#D7DCE5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Sarabun',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  background-image:
    radial-gradient(circle at 15% 8%, rgba(34,58,107,0.05) 0%, transparent 40%),
    radial-gradient(circle at 85% 92%, rgba(184,134,46,0.06) 0%, transparent 40%);
}
#app{max-width:760px;margin:0 auto;padding:28px 18px 60px;}
.back-lesson{display:flex;justify-content:center;padding:10px 16px 0}
.back-lesson a{font:600 14px 'Sarabun',sans-serif;color:var(--primary);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:5px 14px;text-decoration:none}
.back-lesson a:hover{background:var(--gold-bg)}
h1,h2,h3{font-family:'Noto Serif Thai',serif;margin:0;}
.eyebrow{
  font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--primary-light);font-weight:600;margin-bottom:6px;
}
button{font-family:inherit;cursor:pointer;border:none;}

/* ---------- Start screen ---------- */
.cover{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:40px 32px;box-shadow:0 20px 40px -24px rgba(34,58,107,0.35);
  position:relative;overflow:hidden;
}
.cover::before{
  content:"";position:absolute;top:-60px;right:-60px;width:180px;height:180px;
  border-radius:50%;background:radial-gradient(circle,var(--gold-bg) 0%, transparent 70%);
}
.stamp{
  width:72px;height:72px;border:2.5px solid var(--danger);border-radius:50%;
  display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);
  color:var(--danger);font-family:'Noto Serif Thai',serif;font-weight:700;font-size:13px;
  text-align:center;line-height:1.15;margin-bottom:18px;
}
.cover h1{font-size:30px;color:var(--primary);line-height:1.35;}
.cover .sub{color:var(--ink-soft);margin-top:10px;font-size:15px;line-height:1.7;}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0;}
.meta-chip{
  background:var(--paper);border:1px solid var(--border);border-radius:999px;
  padding:8px 16px;font-size:13px;color:var(--primary);font-weight:600;
}
.instructions{
  background:var(--paper);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;
  padding:16px 18px;margin:22px 0;font-size:14px;color:var(--ink-soft);line-height:1.8;
}
.instructions b{color:var(--ink);}
.btn-primary{
  background:var(--primary);color:#fff;padding:15px 30px;border-radius:10px;
  font-size:16px;font-weight:700;width:100%;transition:background .15s;
  font-family:'Sarabun',sans-serif;
}
.btn-primary:hover{background:var(--primary-light);}
.btn-primary:disabled{background:#B7BEC9;cursor:not-allowed;}

/* ---------- Quiz screen ---------- */
.quiz-header{margin-bottom:18px;}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.qcount{font-family:'Noto Serif Thai',serif;font-weight:700;color:var(--primary);font-size:15px;}
.map-btn{
  background:var(--card);border:1px solid var(--border);color:var(--primary);
  padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;
}
.progress-track{height:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:999px;transition:width .25s;}
.section-tag{
  display:inline-block;margin-top:12px;font-size:12px;font-weight:700;color:var(--gold);
  letter-spacing:.06em;text-transform:uppercase;
}

.qcard{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:30px 26px;margin-top:16px;box-shadow:0 16px 30px -22px rgba(27,36,48,.3);
}
.qnum-badge{
  width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:'Noto Serif Thai',serif;
  font-weight:700;font-size:17px;flex-shrink:0;
}
.qhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:22px;}
.qtext{font-size:17px;line-height:1.75;padding-top:6px;font-weight:500;}

.option{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--border);
  border-radius:12px;margin-bottom:10px;transition:all .12s;background:#fff;cursor:pointer;
}
.option:hover{border-color:var(--primary-light);background:#F7F9FC;}
.option.selected{border-color:var(--primary);background:#EEF2FA;}
.bubble{
  width:30px;height:30px;border-radius:50%;border:2px solid var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  color:var(--ink-soft);flex-shrink:0;font-family:'Noto Serif Thai',serif;
}
.option.selected .bubble{background:var(--primary);border-color:var(--primary);color:#fff;}
.option-text{font-size:15px;line-height:1.6;}

.option.locked{cursor:default;}
.option.locked:hover{background:#fff;border-color:var(--border);}
.option.correct-answer{border-color:var(--success);background:var(--success-bg);cursor:default;}
.option.correct-answer:hover{background:var(--success-bg);border-color:var(--success);}
.option.correct-answer .bubble{background:var(--success);border-color:var(--success);color:#fff;}
.option.wrong-answer{border-color:var(--danger);background:var(--danger-bg);cursor:default;}
.option.wrong-answer:hover{background:var(--danger-bg);border-color:var(--danger);}
.option.wrong-answer .bubble{background:var(--danger);border-color:var(--danger);color:#fff;}

.feedback{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:10px;
  font-size:14.5px;font-weight:600;line-height:1.6;margin-top:6px;
  animation:pop .18s ease-out;
}
@keyframes pop{from{transform:scale(.97);opacity:0;}to{transform:scale(1);opacity:1;}}
.fb-correct{background:var(--success-bg);color:var(--success);}
.fb-wrong{background:var(--danger-bg);color:var(--danger);}

.nav-row{display:flex;gap:10px;margin-top:22px;}
.btn-ghost{
  background:#fff;border:1.5px solid var(--border);color:var(--primary);
  padding:14px 20px;border-radius:10px;font-weight:600;font-size:15px;flex:1;
}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed;}
.btn-next{
  background:var(--primary);color:#fff;padding:14px 20px;border-radius:10px;
  font-weight:700;font-size:15px;flex:2;
}
.btn-next:hover{background:var(--primary-light);}

/* map overlay */
.overlay{
  position:fixed;inset:0;background:rgba(27,36,48,.5);display:flex;align-items:flex-end;
  justify-content:center;z-index:50;
}
.map-panel{
  background:#fff;border-radius:18px 18px 0 0;max-width:760px;width:100%;
  padding:22px;max-height:75vh;overflow-y:auto;
}
.map-panel h3{color:var(--primary);margin-bottom:4px;}
.map-panel .sub2{font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
.map-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
.map-cell{
  aspect-ratio:1;border-radius:6px;border:1.5px solid var(--border);background:#fff;
  font-size:12px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
}
.map-cell.answered{background:var(--primary);color:#fff;border-color:var(--primary);}
.map-cell.current{outline:2.5px solid var(--gold);outline-offset:1px;}
.map-close{width:100%;margin-top:16px;padding:13px;border-radius:10px;background:var(--paper);color:var(--primary);font-weight:700;}
.legend{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--ink-soft);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;border:1.5px solid var(--border);}
.dot.filled{background:var(--primary);border-color:var(--primary);}

/* ---------- Result screen ---------- */
.result-card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;padding:34px 28px;
  text-align:center;box-shadow:0 20px 40px -24px rgba(34,58,107,0.35);
}
.score-num{font-family:'Noto Serif Thai',serif;font-weight:900;font-size:64px;color:var(--primary);line-height:1;}
.score-total{font-size:20px;color:var(--ink-soft);}
.score-pct{
  display:inline-block;margin-top:10px;padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px;
}
.pct-good{background:var(--success-bg);color:var(--success);}
.pct-mid{background:var(--gold-bg);color:var(--gold);}
.pct-low{background:var(--danger-bg);color:var(--danger);}
.remark{margin-top:14px;color:var(--ink-soft);font-size:14px;line-height:1.7;}

.breakdown{display:flex;gap:12px;margin-top:24px;}
.bd-card{flex:1;background:var(--paper);border-radius:12px;padding:16px;text-align:left;}
.bd-card .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;}
.bd-card .val{font-family:'Noto Serif Thai',serif;font-size:24px;font-weight:700;color:var(--primary);margin-top:2px;}

.action-row{display:flex;gap:10px;margin-top:26px;}

.review-head{display:flex;justify-content:space-between;align-items:center;margin:34px 0 14px;}
.filter-row{display:flex;gap:8px;}
.filter-btn{
  padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;
  font-size:13px;font-weight:600;color:var(--ink-soft);
}
.filter-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}

.review-item{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 18px;
  margin-bottom:12px;display:flex;gap:12px;
}
.mark{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;border:2.5px solid;
}
.mark.correct{color:var(--success);border-color:var(--success);}
.mark.wrong{color:var(--danger);border-color:var(--danger);}
.ri-num{font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:4px;}
.ri-q{font-size:14.5px;line-height:1.65;margin-bottom:8px;}
.ri-ans{font-size:13.5px;line-height:1.6;}
.ri-ans .yr{color:var(--danger);}
.ri-ans .ck{color:var(--success);}
.ri-ans b{font-weight:700;}

html{-webkit-text-size-adjust:100%}
.btn-ghost,.btn-next{white-space:nowrap}
.feedback{display:block}
#app{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:max(60px,env(safe-area-inset-bottom,0px))}
@media (min-width:900px){#app{max-width:820px}}
@media (max-width:480px){
  #app{padding-top:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .btn-ghost,.btn-next{padding:14px 12px}
  .cover{padding:28px 20px;}
  .cover h1{font-size:24px;}
  .score-num{font-size:52px;}
  .breakdown{flex-direction:column;}
  .map-grid{grid-template-columns:repeat(6,1fr);}
}

/* ---------- เพิ่ม: คำอธิบายเฉลย ---------- */
.explain{margin-top:10px;padding:12px 16px;border-radius:10px;background:var(--paper);
  border-left:3px solid var(--gold);font-size:14px;line-height:1.75;color:var(--ink);}
.explain .pg{color:var(--ink-soft);font-size:12.5px;white-space:nowrap;}
.ri-ans .explain{margin-top:8px;}
</style>
</head>

<script>

 "a": 0, "e": "เอกสารเชื่อมโยงใช้หลังสอนจบ เพราะผู้เรียนต้องมีมโนทัศน์แล้วจึงแสดงแทนได้หลายรูปแบบ", "p": "น. 16 (สื่อ)"}, {"s": 1, "q": "ส่วนประกอบสำคัญของ \"เอกสารตัวอย่างงาน\" คือข้อใด", "o": ["ตัวอย่างวิธีคิด/ขั้นตอนทางคณิตศาสตร์ + โจทย์ฝึกตามตัวอย่างงาน (อาจมีสรุปเนื้อหา)", "ส่วนกิจกรรมแนะแนวทางความคิด + ส่วนสรุปมโนทัศน์หรือวิธีการ", "ชื่อมโนทัศน์ · นิยาม · ลักษณะสำคัญ · ตัวอย่างที่สอดคล้องและไม่สอดคล้อง", "กรอบยืน + กรอบสาขา + เฉลยท้ายกรอบ"], "a": 0, "e": "ตัวเลือกอื่นคือส่วนประกอบของเอกสารแนะแนวทาง เอกสารสรุปมโนทัศน์ และบทเรียนสำเร็จรูปแบบสาขาตามลำดับ", "p": "น. 17, 25 (สื่อ)"}, {"s": 1, "q": "ครูต้องการให้นักเรียนเห็นว่า (a + b)² = a² + b² เป็นวิธีที่ผิด ควรใช้ตัวอย่างงานประเภทใด", "o": ["Incorrect Worked Example", "Faded Worked Example", "Worked Example with Self-explanation", "Comparing Worked Examples (สองวิธีที่ถูก)"], "a": 0, "e": "จุดเน้นข้อ 2 ของตัวอย่างงานคือ \"เน้นให้เห็นความผิดพลาด\" ตรงกับตัวอย่างงานที่แสดงวิธีทำผิดให้วิเคราะห์", "p": "น. 18, 22 (สื่อ)"}, {"s": 1, "q": "ตัวอย่างงานแสดงวิธีแก้ 3(4x + 7) = 15 ที่ถูกต้องครบทุกขั้น แล้วถามว่า \"ทำไม Denise จึงลบ 7 ทั้งสองข้างของสมการ\" ก่อนให้ทำโจทย์คล้ายกัน คือประเภทใด", "o": ["Worked Example with Self-explanation", "Incorrect Worked Example", "Faded Worked Example", "Comparing Worked Examples"], "a": 0, "e": "วิธีทำถูกครบ + คำถามให้ผู้เรียนอธิบายเหตุผลของขั้นตอน = Self-explanation · ถ้าวิธีทำผิดจะเป็น Incorrect", "p": "น. 21 (สื่อ)"}, {"s": 1, "q": "ตามแผนผังการใช้เอกสารตัวอย่างงาน (จารุวรรณ ทัศนโกวิท) หลังขั้นทำเอกสารตัวอย่างงาน ถ้ายังมีเนื้อหาย่อยอื่น ครูควรทำอะไรต่อ", "o": ["กลับไปขั้นสอนเนื้อหาย่อย (เรื่องถัดไป)", "ไปขั้นสรุปบทเรียนรวม", "กลับไปขั้นนำใหม่", "ให้ทำแบบทดสอบท้ายบททันที"], "a": 0, "e": "ลำดับ: ขั้นนำ → สอนเนื้อหาย่อย → สรุปเนื้อหาย่อย → ทำเอกสารตัวอย่างงาน → มีเนื้อหาย่อยอื่นวนกลับไปขั้นสอน · ไม่มีแล้วจึงสรุปบทเรียนรวม", "p": "น. 26 (สื่อ)"}, {"s": 1, "q": "เอกสารแนะแนวทางประกอบด้วย 2 ส่วนใด", "o": ["ส่วนตัวอย่าง/กิจกรรมให้ทำ (แนะแนวทางความคิด) และส่วนสรุปมโนทัศน์หรือวิธีการ", "ส่วนตัวอย่างงาน และส่วนโจทย์ฝึกตามตัวอย่าง", "ส่วนเนื้อหาสาระ และส่วนแบบทดสอบพร้อมเฉลย", "ส่วนคำชี้แจง และส่วนภาระงาน"], "a": 0, "e": "ตัวอย่างงาน + โจทย์ฝึก คือเอกสารตัวอย่างงาน · คำชี้แจง + ภาระงาน คือใบงาน", "p": "น. 28 (สื่อ)"}, {"s": 1, "q": "ขั้นตอนการสร้างเอกสารแนะแนวทาง ข้อใดเรียงถูกต้อง", "o": ["เลือกบทเรียนและเขียนจุดประสงค์ → เขียนเอกสารจากง่ายไปยาก → กำหนดเวลา → ตรวจสอบความถูกต้องก่อนใช้จริง", "เขียนเอกสารจากง่ายไปยาก → เลือกบทเรียนและเขียนจุดประสงค์ → ตรวจสอบความถูกต้อง → กำหนดเวลา", "เลือกบทเรียนและเขียนจุดประสงค์ → กำหนดเวลา → ตรวจสอบความถูกต้อง → เขียนเอกสารจากง่ายไปยาก", "กำหนดเวลา → เลือกบทเรียน → เขียนเอกสาร → เขียนจุดประสงค์"], "a": 0, "e": "เริ่มจากเลือกเนื้อหาและจุดประสงค์ก่อน เขียนเอกสาร แล้วจึงกำหนดเวลา และตรวจก่อนใช้จริงเป็นขั้นสุดท้าย", "p": "น. 30 (สื่อ)"}, {"s": 1, "q": "ขณะเขียนเอกสารแนะแนวทาง ถ้าคำถามข้อใดนักเรียนเติมคำตอบเองไม่ได้ ควรทำอย่างไร", "o": ["เขียนคำตอบให้เลือก เช่น x กับ 3x (คล้าย กับ ไม่คล้าย)", "เว้นว่างไว้ให้ครูเฉลยภายหลัง", "ใส่เฉลยไว้ท้ายเอกสารให้นักเรียนตรวจเอง", "ตัดคำถามข้อนั้นออก"], "a": 0, "e": "หลักคือเขียนแบบเติมคำตอบ ถ้าเติมไม่ได้ให้มีคำตอบให้เลือก · เอกสารแนะแนวทางไม่มีเฉลยในตัว", "p": "น. 31 (สื่อ)"}, {"s": 1, "q": "ถ้าเอกสารแนะแนวทางยาวมาก ครูควรใช้อย่างไร", "o": ["อาจเฉลยคำตอบหรือสรุปมโนทัศน์เป็นตอนๆ ไป", "ให้นักเรียนทำจนจบเล่มก่อนแล้วไม่ต้องเฉลย", "แบ่งให้นักเรียนแต่ละคนทำคนละตอน", "เปลี่ยนไปใช้ใบความรู้แทน"], "a": 0, "e": "ปกติครูเฉลยและสรุปมโนทัศน์อีกครั้งเมื่อทำจบ ถ้ายาวมากแบ่งเฉลย/สรุปเป็นตอนได้", "p": "น. 32 (สื่อ)"}, {"s": 1, "q": "รูปแบบ (ลักษณะและส่วนประกอบ) ของใบกิจกรรม ขึ้นอยู่กับอะไรเป็นหลัก", "o": ["ลักษณะกิจกรรมการเรียนรู้ที่ออกแบบ ว่าใช้วิธีสอน/รูปแบบการสอน/กิจกรรมแบบใด", "ระดับชั้นของผู้เรียน", "จำนวนหน้าของเนื้อหาในหนังสือเรียน", "จำนวนนักเรียนในห้อง"], "a": 0, "e": "เช่น ใบกิจกรรมแบบอุปนัยจะมีส่วนสังเกตตัวอย่าง หาความสัมพันธ์ และเขียนข้อสรุป", "p": "น. 34 (สื่อ)"}, {"s": 1, "q": "ส่วนใดของใบกิจกรรมที่เอกสารระบุว่า \"ต้องคิดและออกแบบอย่างรอบคอบ\"", "o": ["กิจกรรมที่ให้นักเรียนทำและบริเวณให้บันทึก", "คำชี้แจงการปฏิบัติ", "ข้อมูล/เนื้อหาสาระ", "แหล่งเรียนรู้และเฉลย"], "a": 0, "e": "ส่วนกิจกรรม (คิด อ่าน เขียน สรุป สะท้อนความคิด) มีเครื่องหมาย * กำกับว่าต้องออกแบบอย่างรอบคอบ · ข้อมูล/เนื้อหาอาจมีหรือไม่มีก็ได้", "p": "น. 35 (สื่อ)"}, {"s": 1, "q": "กิจกรรมในใบกิจกรรมแบบอุปนัย ข้อใดเรียงถูกต้อง", "o": ["สังเกตชุดตัวอย่าง/เติมข้อมูล → ค้นหาความสัมพันธ์ → เขียนข้อสรุปของความสัมพันธ์ → สร้างข้อสรุปที่เป็นความรู้", "สร้างข้อสรุปที่เป็นความรู้ → ยกตัวอย่าง → ตรวจสอบกับตัวอย่าง → ฝึกทำโจทย์", "ค้นหาความสัมพันธ์ → สังเกตชุดตัวอย่าง → สร้างข้อสรุป → เขียนข้อสรุปของความสัมพันธ์", "อ่านนิยาม → ดูตัวอย่างงาน → ฝึกทำตาม → สรุปบทเรียน"], "a": 0, "e": "อุปนัยเริ่มจากตัวอย่างไปสู่ข้อสรุป · ตัวเลือกที่เริ่มจากข้อสรุปคือแนวนิรนัย", "p": "น. 37 (สื่อ)"}, {"s": 1, "q": "การออกแบบ \"ภาระงาน\" ในใบงาน อาจใช้อะไรเป็นแนวทาง", "o": ["ระดับการคิดของบลูม", "ทักษะและกระบวนการทางคณิตศาสตร์ 5 ด้าน", "กรอบ PTCF", "4 รูปแบบการแสดงแทนของเอกสารเชื่อมโยง"], "a": 0, "e": "เช่น สอนแล้วคาดว่าถึงระดับเข้าใจแต่ยังไม่ชัด จึงให้ภาระงานที่เน้นเข้าใจ แล้วเพิ่มภาระงานระดับนำไปใช้", "p": "น. 40 (สื่อ)"}, {"s": 1, "q": "ข้อใด \"ไม่ใช่\" เหตุผลที่ครูต้องเรียบเรียงใบความรู้ขึ้นเอง", "o": ["ต้องการให้นักเรียนฝึกทำโจทย์ซ้ำจนชำนาญ", "เนื้อหาไม่มีในหนังสือที่ตรงกับความต้องการ", "เนื้อหากระจายอยู่ในหนังสือหลายเล่ม", "เนื้อหามีรายละเอียดมาก ต้องใช้เวลาคัดลอก"], "a": 0, "e": "การฝึกทักษะซ้ำเป็นเป้าของใบงาน · ใบความรู้คือเนื้อหาให้นักเรียนศึกษาด้วยตนเอง", "p": "น. 42 (สื่อ)"}, {"s": 1, "q": "ตอนย่อยๆ ที่แบ่งไว้ในบทเรียนแบบโปรแกรม/บทเรียนสำเร็จรูป เรียกว่าอะไร", "o": ["กรอบ (Frame)", "หน่วย (Unit)", "โมดูล (Module)", "ใบงาน (Worksheet)"], "a": 0, "e": "เนื้อหาแบ่งเป็นตอนย่อยจากง่ายไปยาก เรียกว่ากรอบ แต่ละกรอบมีคำถามและเฉลยให้ทราบทันที", "p": "น. 46 (สื่อ)"}, {"s": 1, "q": "ในบทเรียนสำเร็จรูป \"แบบเส้นตรง\" ถ้าผู้เรียนตอบผิดในกรอบใด ต้องทำอย่างไร", "o": ["อ่านทำความเข้าใจกรอบนั้นซ้ำจนตอบถูก แล้วจึงไปกรอบต่อไป", "ไปที่กรอบสาขาที่อธิบายว่าทำไมจึงตอบผิด", "ข้ามไปกรอบต่อไปได้เลย แล้วกลับมาทำทีหลัง", "เริ่มบทเรียนใหม่ตั้งแต่กรอบแรก"], "a": 0, "e": "การไปกรอบสาขา (Remedial Frame) เป็นของแบบสาขา · แบบเส้นตรงใช้การอ่านซ้ำ", "p": "น. 47, 49 (สื่อ)"}, {"s": 1, "q": "บทเรียนการ์ตูนต่างจากบทเรียนสำเร็จรูปตรงไหน", "o": ["เนื้อหาสาระถูกนำเสนอผ่านเรื่องราวและการ์ตูน", "ไม่มีคำถามหรือกิจกรรมให้ทำ", "ไม่มีเฉลยให้ผู้เรียน", "ต้องใช้ครูสอนประกอบทุกหน้า"], "a": 0, "e": "บทเรียนการ์ตูนคล้ายบทเรียนสำเร็จรูป มีเนื้อหา คำถาม/กิจกรรม และเฉลย ต่างกันที่นำเสนอผ่านเรื่องราวและการ์ตูน", "p": "น. 52 (สื่อ)"}, {"s": 1, "q": "ชุดการเรียนการสอนแบ่งตามผู้ใช้เป็นกี่แบบ อะไรบ้าง", "o": ["3 แบบ: สำหรับครู · สำหรับนักเรียน · แบบผสม", "2 แบบ: แบบเส้นตรง · แบบสาขา", "2 แบบ: สำหรับครู · สำหรับนักเรียน", "4 แบบ: รายบุคคล · กลุ่มย่อย · ทั้งห้อง · ทางไกล"], "a": 0, "e": "แบบเส้นตรง/สาขาเป็นชนิดของบทเรียนสำเร็จรูป ไม่ใช่ชุดการเรียนการสอน", "p": "น. 55 (สื่อ)"}, {"s": 1, "q": "ส่วน \"การประเมินผล\" ในชุดการเรียนการสอน เป็นการประเมินแบบใด", "o": ["ประเมินผลกระบวนการ", "ประเมินผลสัมฤทธิ์ปลายภาคเท่านั้น", "ประเมินความพร้อมก่อนเรียนเท่านั้น", "ประเมินความพึงพอใจของผู้ปกครอง"], "a": 0, "e": "ส่วนประกอบข้อ 4 ของชุดการเรียนการสอนเขียนว่า \"การประเมินผล เป็นการประเมินผลกระบวนการ\"", "p": "น. 56 (สื่อ)"}, {"s": 1, "q": "\"เอกสารประกอบการเรียนการสอน\" ต้องสะท้อนให้เห็นอะไรอย่างเป็นระบบ", "o": ["เนื้อหาวิชาและกิจกรรมของผู้เรียน", "ผลการวิจัยของครูผู้สอน", "ประวัติและผลงานของผู้เขียน", "คะแนนของผู้เรียนรายบุคคล"], "a": 0, "e": "นิยาม: เอกสาร/สื่อสิ่งพิมพ์ประกอบการสอนรายวิชาตามหลักสูตร ที่สะท้อน \"เนื้อหาวิชาและกิจกรรมของผู้เรียน\" อย่างเป็นระบบ", "p": "น. 58 (สื่อ)"}, {"s": 2, "q": "พิมพ์ y = x² − 4 และ y = x + 2 ใน Input แล้วใช้เครื่องมือ Intersect คลิกกราฟทั้งสอง จะได้จุดใด", "o": ["(−2, 0) และ (3, 5)", "(2, 0) และ (−3, −1)", "(−2, 0) และ (2, 0)", "(0, −4) และ (0, 2)"], "a": 0, "e": "x² − 4 = x + 2 → x² − x − 6 = 0 → x = 3, −2 → y = 5, 0 · (−2,0),(2,0) คือรากของ y = x² − 4 อย่างเดียว · (0,−4),(0,2) คือจุดตัดแกน Y", "p": "น. — ส่วน GeoGebra ในสรุป (หน้า 10, 13)"}, {"s": 2, "q": "ใช้เครื่องมือ Extremum คลิกกราฟ f(x) = x² − 2x − 3 จะได้จุดใด", "o": ["(1, −4)", "(−1, 0)", "(0, −3)", "(3, 0)"], "a": 0, "e": "Extremum ให้จุดสูงสุด/ต่ำสุดสัมพัทธ์ = จุดยอด x = 1, f(1) = −4 · (−1,0),(3,0) ได้จาก Roots · (0,−3) คือจุดตัดแกน Y", "p": "น. — ส่วน GeoGebra ในสรุป (หน้า 10, 13)"}, {"s": 2, "q": "ใน Graphing Calculator ต้องการจุดกึ่งกลางของ AB ต้องพิมพ์คำสั่งใดในช่อง Input", "o": ["Midpoint(A, B)", "Center(A, B)", "Segment(A, B)", "PerpendicularBisector(A, B)"], "a": 0, "e": "Graphing Calculator ไม่มีเครื่องมือ Midpoint ต้องพิมพ์คำสั่ง · PerpendicularBisector ได้เส้นแบ่งครึ่งตั้งฉาก ไม่ใช่จุด", "p": "น. — ส่วน GeoGebra ในสรุป (หน้า 11)"}, {"s": 2, "q": "คำสั่งสร้างวงกลมจุดศูนย์กลาง A รัศมี 3 หน่วย คือข้อใด", "o": ["Circle(A, 3)", "Circle(3, A)", "Polygon(A, 3)", "Distance(A, 3)"], "a": 0, "e": "รูปแบบคือ Circle(จุดศูนย์กลาง, รัศมี)", "p": "น. — ส่วน GeoGebra ในสรุป (หน้า 11)"}, {"s": 2, "q": "คำสั่งสร้าง slider a ค่าตั้งแต่ −10 ถึง 10 เพิ่มทีละ 0.1 ด้วยคำสั่งเดียว คือข้อใด", "o": ["a = Slider(-10, 10, 0.1)", "a = Slider(0.1, -10, 10)", "a = Slider(-10, 0.1, 10)", "Slider(a) = -10 : 10 : 0.1"], "a": 0, "e": "ลำดับคือ Slider(Min, Max, Increment) แล้วค่อยพิมพ์ y = a x^2", "p": "น. — ส่วน GeoGebra ในสรุป (หน้า 13)"}, {"s": 2, "q": "ต้องการจุดที่ลากได้เฉพาะบนวงกลม (ลากออกนอกเส้นไม่ได้) ควรใช้เครื่องมือใด", "o": ["Point on Object", "Move", "Intersect", "Complex Number"], "a": 0, "e": "Point on Object สร้างจุดที่ขยับได้เฉพาะบน/ในวัตถุนั้น · Move ใช้ลากวัตถุอิสระ", "p": "น. — ส่วน GeoGebra ในสรุป (หน้า 10)"}, {"s": 2, "q": "มีจุดอิสระ P อยู่แล้ว ต้องการผูก P ให้อยู่บนเส้นตรง f ควรใช้เครื่องมือใด", "o": ["Attach / Detach Point", "Point on Object", "Copy Visual Style", "Select Objects"], "a": 0, "e": "Attach / Detach Point ใช้กับจุดที่มีอยู่แล้ว (คลิกจุด แล้วคลิกวัตถุ) · Point on Object ใช้สร้างจุดใหม่บนวัตถุ", "p": "น. — ส่วน GeoGebra ในสรุป (หน้า 10)"}, {"s": 2, "q": "เครื่องมือ Copy Visual Style ใช้ทำอะไร", "o": ["คัดลอกสี ลักษณะเส้น และความหนาจากวัตถุต้นแบบไปยังวัตถุอื่น", "คัดลอกวัตถุทั้งชิ้นไปวางตำแหน่งใหม่", "คัดลอกสมการของวัตถุไปช่อง Input", "คัดลอกหน้าจอเป็นรูปภาพ"], "a": 0, "e": "คลิกวัตถุต้นแบบก่อน แล้วคลิกวัตถุอื่นที่จะให้หน้าตาเหมือนกัน", "p": "น. — ส่วน GeoGebra ในสรุป (หน้า 10)"}, {"s": 2, "q": "สร้าง f = Segment(A, B) ไว้ แล้วใช้เครื่องมือ Delete คลิกจุด A จะเกิดอะไรขึ้น", "o": ["จุด A และส่วนของเส้นตรง f หายไปทั้งคู่", "จุด A หายไป แต่ f ยังอยู่ที่เดิม", "f หายไป แต่จุด A ยังอยู่", "ลบไม่ได้ เพราะ A ถูกใช้สร้างวัตถุอื่น"], "a": 0, "e": "วัตถุที่สร้างต่อจากวัตถุที่ถูกลบจะหายไปด้วย — ถ้าแค่อยากให้มองไม่เห็นให้ใช้การซ่อนแทน", "p": "น. — ส่วน GeoGebra ในสรุป (หน้า 10)"}, {"s": 2, "q": "ต้องการช่องให้นักเรียนพิมพ์ค่าเองแล้วกราฟเปลี่ยนตาม ควรใช้เครื่องมือใด", "o": ["Input Box", "Check Box", "Button", "Text"], "a": 0, "e": "Input Box ผูกกับวัตถุ ผู้ใช้พิมพ์ค่าเปลี่ยนวัตถุได้ · Check Box ใช้แสดง/ซ่อน · Button ใช้รันสคริปต์", "p": "น. — ส่วน GeoGebra ในสรุป (หน้า 11)"}, {"s": 3, "q": "ข้อใด \"ไม่ใช่\" หลักจริยธรรม AI 5 ข้อตามเอกสาร (Hagendorf, 2020; UNESCO, 2024)", "o": ["ความรวดเร็วในการประมวลผล (Efficiency)", "ความโปร่งใสและการเปิดเผยข้อมูล (Transparency, openness)", "ความเป็นธรรม ไม่เลือกปฏิบัติ (Fairness, non-discrimination)", "ความปลอดภัยและการไม่ก่ออันตราย (Safety, no harm)"], "a": 0, "e": "5 ข้อ = การตรวจสอบและความรับผิดชอบ · ความเป็นส่วนตัว · ความเป็นธรรม · ความโปร่งใส · ความปลอดภัย", "p": "น. 9 (AI)"}, {"s": 3, "q": "ระบบ AI ให้คะแนนเรียงความต่ำกับนักเรียนกลุ่มหนึ่งอย่างไม่สมเหตุสมผลเพียงเพราะสำนวนภาษาถิ่น ขัดหลักจริยธรรม AI ข้อใดชัดที่สุด", "o": ["ความเป็นธรรม ไม่เลือกปฏิบัติ", "การคุ้มครองความเป็นส่วนตัว", "ความโปร่งใสและการเปิดเผยข้อมูล", "ความปลอดภัยและการไม่ก่ออันตราย"], "a": 0, "e": "ปฏิบัติต่อนักเรียนต่างกันด้วยลักษณะที่ไม่เกี่ยวกับคุณภาพงาน = เลือกปฏิบัติ", "p": "น. 9 (AI)"}, {"s": 3, "q": "ใน prompt ตัวอย่างสร้างข้อสอบเลือกตอบ ส่วนที่ว่า \"เรื่องสมบัติของการคูณและหารเลขยกกำลังที่มีฐานเดียวกัน โดยเป็นเนื้อหาระดับชั้น ม.2 โดยขอเป็นโจทย์ที่ใช้สมบัติเลขยกกำลังผสมกัน 3–4 สมบัติ\" คือองค์ประกอบใดของ PTCF", "o": ["Context", "Task", "Persona", "Format"], "a": 0, "e": "สไลด์ระบายสี: \"คุณเป็นครูคณิต…\" = Persona · \"ช่วยสร้างข้อสอบ 4 ตัวเลือก… 5 ข้อ\" = Task · เรื่อง/ระดับชั้น/จำนวนสมบัติ = Context · เฉลย+ภาษาทางการ = Format", "p": "น. 22 (AI)"}, {"s": 3, "q": "ครูได้ข้อสอบจาก AI แล้วถามตัวเองว่า \"ได้ผลลัพธ์ตามที่ต้องการไหม\" จากนั้นพิมพ์ต่อว่า \"ช่วยปรับโจทย์ให้ซับซ้อนกว่านี้อีก\" การพิมพ์สั่งปรับนี้ตรงกับขั้นใดของ Google's AI Prompting", "o": ["Iterate", "Evaluate", "Reference", "Context"], "a": 0, "e": "Evaluate = ตรวจว่าผลลัพธ์ใช้ได้ไหม · Iterate = สั่งปรับซ้ำจนได้ตามต้องการ (ขั้นสุดท้ายของ Task → Context → Reference → Evaluate → Iterate)", "p": "น. 13, 22–23 (AI)"}, {"s": 3, "q": "ครูให้ AI สร้างรูบริก ตรวจงาน และวิเคราะห์ข้อผิดพลาดของนักเรียนแต่ละคน ตรงกับบทบาทใดใน 4 Roles of AI in Mathematics Education", "o": ["AI as an Assessment Assistant", "AI as a Task Designer", "AI as a Content Assistant", "AI as a Thinking Partner"], "a": 0, "e": "งานตรวจและประเมินคือ Assessment Assistant · ออกแบบกิจกรรม/โจทย์คือ Task Designer", "p": "น. 18, 20 (AI)"}, {"s": 3, "q": "ข้อใดอยู่ในการประยุกต์ AI (AIME) \"ด้านการตรวจงานและการประเมิน\"", "o": ["ตรวจสอบความซื่อสัตย์ทางวิชาการ (academic integrity)", "ออกแบบการเรียนรู้ให้ปรับเหมาะกับผู้เรียน (Personalized learning)", "ออกแบบหรือร่างแผนการสอนเบื้องต้น", "สร้างเกมหรือแต่งเพลงคณิตศาสตร์"], "a": 0, "e": "อีก 3 ตัวเลือกอยู่ในด้านการจัดการเรียนรู้และสื่อการสอน", "p": "น. 19–20 (AI)"}, {"s": 3, "q": "ข้อใดอยู่ในการประยุกต์ AI (AIME) \"ด้านการจัดการเรียนรู้และสื่อการสอน\"", "o": ["ยกตัวอย่างโจทย์/สถานการณ์ที่สอดคล้องกับเนื้อหาคณิตศาสตร์", "สร้างรูบริกตรวจชิ้นงานแบบเขียนตอบ", "ให้ข้อมูลป้อนกลับ (feedback) ในการตรวจแบบฝึกหัด", "วิเคราะห์ข้อผิดพลาด (errors) ของผู้เรียนแต่ละคน"], "a": 0, "e": "รูบริก feedback และวิเคราะห์ errors อยู่ในด้านการตรวจงานและการประเมิน", "p": "น. 19–20 (AI)"}, {"s": 3, "q": "ครูถาม AI เรื่องโจทย์ ม.2 แต่ AI อธิบายด้วยแคลคูลัส ตรงกับข้อจำกัดของ AIME ข้อใด", "o": ["อธิบายด้วยวิธีหรือเนื้อหาระดับสูงเกินกว่าบทเรียน", "เกิดภาวะ Hallucination", "ข้อจำกัดด้านงบประมาณและอินเทอร์เน็ต", "ทำให้ขาดปฏิสัมพันธ์ระหว่างมนุษย์"], "a": 0, "e": "คำตอบอาจถูกแต่เกินระดับผู้เรียน — ต่างจาก Hallucination ที่ AI สร้างข้อมูลผิด/ไม่มีจริง", "p": "น. 21 (AI)"}, {"s": 3, "q": "AI แก้สมการที่มีรากที่สองแล้วลืมพิจารณาโดเมน-เรนจ์ ได้คำตอบเกินมา ตรงกับข้อจำกัดของ AIME ข้อใด", "o": ["ผิดพลาดในการคำนวณ/แสดงวิธีทำ หรือใช้เงื่อนไขไม่ครบถ้วน", "เน้นการคำนวณหรือผลลัพธ์มากไป", "อธิบายด้วยเนื้อหาระดับสูงเกินบทเรียน", "ทำให้นักเรียนขาดความคิดสร้างสรรค์"], "a": 0, "e": "เอกสารยกตัวอย่าง \"ลืมพิจารณาโดเมน-เรนจ์\" ไว้ในข้อจำกัดข้อ 1 โดยตรง", "p": "น. 21 (AI)"}, {"s": 3, "q": "ตามเอกสาร ข้อใด \"ไม่ใช่\" สิ่งที่ Canva AI ช่วยทำได้", "o": ["สรุปเนื้อหาจากลิงก์ YouTube แล้วสร้างไฟล์เสียงคล้าย podcast", "สร้างใบงาน/ใบกิจกรรม", "สร้างเกมการสอน เช่น จับคู่ เติมคำตอบ ลาก-วาง", "สร้างสคริปต์วิดีโอและสตอรีบอร์ด"], "a": 0, "e": "สรุปจากลิงก์ + ไฟล์เสียงคล้าย podcast คือ NotebookLM · Canva AI ทำใบงาน สไลด์ เกม สคริปต์วิดีโอ เพลง/กลอน", "p": "น. 27–28 (AI)"}, {"s": 3, "q": "ในตัวอย่าง prompt เกม \"ตามล่าหาขุมทรัพย์\" (คู่อันดับ) ผู้เขียนสั่งให้สุ่มตัวหลอกด้วยเรื่องใด", "o": ["เครื่องหมายบวก/ลบของพิกัด เช่น หา (−1, 1) แต่มี (1, 1), (1, −1) หลอก", "สีของจุดวงกลม", "ขนาดของจุดวงกลม", "สลับลำดับโจทย์ทุกครั้งที่เล่น"], "a": 0, "e": "prompt ระบุให้ตัวหลอกต่างกันที่เครื่องหมาย — ตรงกับจุดที่นักเรียนสับสนจริงเรื่องคู่อันดับ", "p": "น. 36 (AI)"}, {"s": 3, "q": "ตามเอกสาร Suno AI ใช้แต่งเพลงได้กี่แบบ อะไรบ้าง", "o": ["2 แบบ: ให้แต่งทั้งเนื้อและทำนอง · นำเนื้อเพลงที่มีมาใส่ทำนอง", "2 แบบ: แต่งเฉพาะเนื้อ · แต่งเฉพาะทำนอง", "3 แบบ: ประถม · มัธยมต้น · มัธยมปลาย", "1 แบบ: ต้องมีเนื้อเพลงก่อนเสมอ"], "a": 0, "e": "สไลด์ Suno ระบุ 2 แบบไว้ใต้โลโก้ ส่วนตาราง Song Style แบ่งประถม/มัธยมตอนต้น", "p": "น. 39 (AI)"}, {"s": 3, "q": "ข้อใด \"ไม่ใช่\" ประเภทหลักของ chatbot ตามเอกสาร", "o": ["Search-Engine Chatbots", "Rule-Based Chatbots", "Hybrid Chatbots", "Voice-Enabled Chatbots"], "a": 0, "e": "4 ประเภท = Rule-Based · AI-Powered · Hybrid · Voice-Enabled", "p": "น. 44 (AI)"}, {"s": 3, "q": "ข้อใด \"ไม่ใช่\" การ /* Fisher–Yates shuffle, returns a new array */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* สุ่มลำดับข้อ "ภายในแต่ละส่วน" (ส่วนยังเรียงตามเดิม ให้ตรงกับคำชี้แจง) และสุ่มลำดับตัวเลือก
   ตัวเลือก ถูก/ผิด ไม่สุ่ม */
function prepareQuestions(){
  DATA = [];
  SECTIONS.forEach((_,si)=>{
    shuffle(RAW_DATA.filter(d=>d.s===si+1)).forEach(item=>{
      const tf = item.o.length===2;
      const order = tf ? [0,1] : shuffle(item.o.map((_,i)=>i));
      DATA.push({ ...item, o:order.map(oi=>item.o[oi]), a:order.indexOf(item.a) });
    });
  });
}

function secRange(si){
  const start = DATA.findIndex(d=>d.s===si+1);
  const n = DATA.filter(d=>d.s===si+1).length;
  return [start+1, start+n];
}

/* ===================== STATE ===================== */
let state = { screen:"start", idx:0, answers:new Array(TOTAL).fill(null), showMap:false, filter:"all" };
const app = document.getElementById("app");

function render(){
  if(state.screen==="start") renderStart();
  else if(state.screen==="quiz") renderQuiz();
  else renderResult();
}

function renderStart(){
  const nTF = RAW_DATA.filter(d=>d.o.length===2).length;
  const types = nTF ? "ปรนัย / ถูก-ผิด" : "ปรนัย";
  const minutes = Math.max(5, Math.round(TOTAL*0.4/5)*5);
  app.innerHTML = `
    <div class="cover">
      <div class="stamp">แบบ<br>ทดสอบ</div>
      <div class="eyebrow">${QUIZ.eyebrow||"แบบทดสอบทบทวนความรู้"}</div>
      <h1>${QUIZ.title}</h1>
      <p class="sub">${QUIZ.subtitle}</p>
      <div class="meta-row">
        <div class="meta-chip">📝 ${TOTAL} ข้อ</div>
        <div class="meta-chip">🕒 ~${minutes} นาที</div>
        <div class="meta-chip">🎯 ${types}</div>
      </div>
      <div class="instructions">
        <b>คำชี้แจง</b><br>
        ${SECTIONS.map((name,si)=>{ const [a,b]=secRange(si); return `${si+1}. ข้อ ${a}–${b} เป็นเนื้อหาส่วนที่ ${si+1}: ${name}<br>`; }).join("")}
        ${SECTIONS.length+1}. เลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว ตอบแล้วจะเห็นเฉลยและคำอธิบายทันที<br>
        ${SECTIONS.length+2}. เมื่อทำครบทุกข้อแล้วให้กด "ส่งคำตอบ" เพื่อดูผลคะแนนและเฉลยรายข้อ
      </div>
      <button class="btn-primary" onclick="startQuiz()">เริ่มทำข้อสอบ</button>
    </div>
  `;
}

function startQuiz(){ state.screen="quiz"; state.idx=0; render(); }

function explainBox(item){
  return `<div class="explain">${item.e} <span class="pg">· ${item.p}</span></div>`;
}

function renderQuiz(){
  const i = state.idx;
  const item = DATA[i];
  const answeredCount = state.answers.filter(a=>a!==null).length;
  const pct = Math.round((answeredCount/TOTAL)*100);
  const letters = item.o.length===2 ? ["ก","ข"] : LETTERS;

  app.innerHTML = `
    <div class="quiz-header">
      <div class="top-row">
        <div class="qcount">ข้อ ${i+1} / ${TOTAL}</div>
        <button class="map-btn" onclick="toggleMap(true)">☰ ภาพรวมข้อสอบ</button>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="section-tag">ส่วนที่ ${item.s} · ${SECTIONS[item.s-1]}</div>
    </div>

    <div class="qcard">
      <div class="qhead">
        <div class="qnum-badge">${i+1}</div>
        <div class="qtext">${item.q}</div>
      </div>
      <div class="opts">
        ${item.o.map((opt,oi)=>{
          const answered = state.answers[i]!==null;
          let cls = "option";
          if(answered){
            cls += " locked";
            if(oi===item.a) cls += " correct-answer";
            else if(oi===state.answers[i]) cls += " wrong-answer";
          }
          const mark = answered && oi===item.a ? "✓" : (answered && oi===state.answers[i] ? "✗" : letters[oi]);
          const click = answered ? "" : `onclick="selectOption(${oi})"`;
          return `
            <div class="${cls}" ${click}>
              <div class="bubble">${mark}</div>
              <div class="option-text">${opt}</div>
            </div>
          `;
        }).join("")}
      </div>
      ${state.answers[i]!==null ? `
        <div class="feedback ${state.answers[i]===item.a?'fb-correct':'fb-wrong'}">
          ${state.answers[i]===item.a
            ? "✓ ถูกต้อง!"
            : `✗ ไม่ถูกต้อง — คำตอบที่ถูกต้องคือ <b>${letters[item.a]}. ${item.o[item.a]}</b>`}
        </div>
        ${explainBox(item)}
      `:""}
      <div class="nav-row">
        <button class="btn-ghost" ${i===0?'disabled':''} onclick="prevQ()">← ก่อนหน้า</button>
        <button class="btn-next" onclick="nextQ()">${i===TOTAL-1?'ส่งคำตอบ':'ถัดไป →'}</button>
      </div>
    </div>

    ${state.showMap?renderMap():""}
  `;
}

function selectOption(oi){ state.answers[state.idx]=oi; render(); }
function nextQ(){ if(state.idx<TOTAL-1){ state.idx++; render(); } else finishQuiz(); }
function prevQ(){ if(state.idx>0){ state.idx--; render(); } }
function toggleMap(v){ state.showMap=v; render(); }
function jumpTo(i){ state.idx=i; state.showMap=false; render(); }

function renderMap(){
  return `
    <div class="overlay" onclick="if(event.target===this)toggleMap(false)">
      <div class="map-panel">
        <h3>ภาพรวมข้อสอบ</h3>
        <div class="sub2">แตะหมายเลขข้อเพื่อข้ามไปทำข้อนั้น ๆ</div>
        <div class="map-grid">
          ${DATA.map((_,i)=>`
            <div class="map-cell ${state.answers[i]!==null?'answered':''} ${i===state.idx?'current':''}" onclick="jumpTo(${i})">${i+1}</div>
          `).join("")}
        </div>
        <div class="legend">
          <span><span class="dot filled"></span> ตอบแล้ว</span>
          <span><span class="dot"></span> ยังไม่ตอบ</span>
        </div>
        <button class="map-close" onclick="toggleMap(false)">ปิด</button>
      </div>
    </div>
  `;
}

function finishQuiz(){
  const unanswered = state.answers.map((a,i)=>a===null?i+1:null).filter(x=>x!==null);
  if(unanswered.length>0){
    const goFirst = confirm(`คุณยังไม่ได้ตอบทั้งหมด ${unanswered.length} ข้อ (ข้อ ${unanswered.slice(0,10).join(", ")}${unanswered.length>10?" ...":""})\n\nกด "ตกลง" เพื่อไปยังข้อแรกที่ยังไม่ได้ตอบ หรือกด "ยกเลิก" เพื่อส่งคำตอบทันที`);
    if(goFirst){ state.idx = unanswered[0]-1; render(); return; }
  }
  state.screen="result"; state.filter="all"; render();
  window.scrollTo(0,0);
}

function computeScore(){
  const per = SECTIONS.map(()=>({c:0,t:0}));
  let correct=0;
  DATA.forEach((item,i)=>{
    const ok = state.answers[i]===item.a;
    per[item.s-1].t++; if(ok){ per[item.s-1].c++; correct++; }
  });
  return {correct, total:TOTAL, per};
}

function renderResult(){
  const sc = computeScore();
  const pct = Math.round((sc.correct/sc.total)*100);
  let pctClass = "pct-low", remark = "ควรกลับไปทบทวนเนื้อหาเพิ่มเติมอีกครั้ง โดยเฉพาะข้อที่ตอบผิดด้านล่าง (มีเลขหน้าให้เปิดกลับไปอ่าน)";
  if(pct>=80){ pctClass="pct-good"; remark="ยอดเยี่ยมมาก! เข้าใจเนื้อหาได้ดี"; }
  else if(pct>=60){ pctClass="pct-mid"; remark="พื้นฐานดี แต่ยังมีบางหัวข้อที่ควรทบทวนเพิ่มเติม"; }

  app.innerHTML = `
    <div class="result-card">
      <div class="eyebrow">ผลการทดสอบ</div>
      <div class="score-num">${sc.correct}</div>
      <div class="score-total">จาก ${sc.total} ข้อ</div>
      <div class="score-pct ${pctClass}">${pct}%</div>
      <p class="remark">${remark}</p>
      <div class="breakdown" style="flex-wrap:wrap;">
        ${SECTIONS.map((name,si)=>`
          <div class="bd-card" style="min-width:150px;">
            <div class="lbl">ส่วนที่ ${si+1} · ${name}</div>
            <div class="val">${sc.per[si].c} / ${sc.per[si].t}</div>
          </div>`).join("")}
      </div>
      <div class="action-row">
        <button class="btn-ghost" onclick="retake()">↻ ทำข้อสอบใหม่</button>
        <button class="btn-next" onclick="document.getElementById('reviewAnchor').scrollIntoView({behavior:'smooth'})">ดูเฉลยรายข้อ ↓</button>
      </div>
    </div>

    <div id="reviewAnchor"></div>
    <div class="review-head">
      <h3 style="color:var(--primary);font-size:19px;">เฉลยรายข้อ</h3>
      <div class="filter-row">
        <button class="filter-btn ${state.filter==='all'?'active':''}" onclick="setFilter('all',this)">ทั้งหมด</button>
        <button class="filter-btn ${state.filter==='wrong'?'active':''}" onclick="setFilter('wrong',this)">ตอบผิด</button>
        <button class="filter-btn ${state.filter==='correct'?'active':''}" onclick="setFilter('correct',this)">ตอบถูก</button>
      </div>
    </div>
    <div id="reviewList">${renderReviewList()}</div>
  `;
}

function setFilter(f,btn){
  state.filter=f;
  document.getElementById("reviewList").innerHTML = renderReviewList();
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

function renderReviewList(){
  let items = DATA.map((item,i)=>({item,i,ok:state.answers[i]===item.a}));
  if(state.filter==="wrong") items = items.filter(x=>!x.ok);
  if(state.filter==="correct") items = items.filter(x=>x.ok);
  if(items.length===0) return `<p style="color:var(--ink-soft);text-align:center;padding:24px;">ไม่มีรายการในหมวดนี้</p>`;

  return items.map(({item,i,ok})=>{
    const letters = item.o.length===2 ? ["ก","ข"] : LETTERS;
    const userIdx = state.answers[i];
    const userText = userIdx===null ? "ไม่ได้ตอบ" : `${letters[userIdx]}. ${item.o[userIdx]}`;
    const correctText = `${letters[item.a]}. ${item.o[item.a]}`;
    return `
      <div class="review-item">
        <div class="mark ${ok?'correct':'wrong'}">${ok?'✓':'✗'}</div>
        <div style="flex:1;">
          <div class="ri-num">ข้อ ${i+1} · ส่วนที่ ${item.s}</div>
          <div class="ri-q">${item.q}</div>
          <div class="ri-ans">
            <div><b>คำตอบของคุณ:</b> <span class="${ok?'ck':'yr'}">${userText}</span></div>
            ${ok?"":`<div><b>คำตอบที่ถูกต้อง:</b> <span class="ck">${correctText}</span></div>`}
            ${explainBox(item)}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function retake(){
  prepareQuestions();
  state = { screen:"start", idx:0, answers:new Array(TOTAL).fill(null), showMap:false, filter:"all" };
  render();
  window.scrollTo(0,0);
}

prepareQuestions();
render();

</script>
</body>
</html>
